<body data-mode="__TD_MODE__">

<!-- ===================== 配对（未授权时显示） ===================== -->
<div id="pairView" class="pair-wrap" hidden>
    <div class="pair-card">
        <div class="pair-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="M12 12v9"/><path d="m4 7.5 8 4.5 8-4.5"/>
            </svg>
        </div>
        <h1 class="pair-title">连接到 TransData</h1>
        <p class="pair-sub muted">用手机扫描电脑上的二维码，或输入窗口里显示的配对码。</p>
        <form id="pairForm" class="pair-form" autocomplete="off">
            <input id="pairCode" class="code-input" type="text" inputmode="numeric" pattern="[0-9]*"
                   maxlength="8" placeholder="00000000" aria-label="8 位配对码" spellcheck="false">
            <button class="btn btn--primary btn--wide" type="submit" id="pairSubmit">连接</button>
        </form>
        <p class="pair-msg" id="pairMsg" role="status" aria-live="polite"></p>
    </div>
</div>

<!-- ===================== 主界面 ===================== -->
<div id="appView" class="app" hidden>

    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="M12 12v9"/><path d="m4 7.5 8 4.5 8-4.5"/>
                </svg>
            </span>
            <span class="brand-name">TransData</span>
        </div>
        <div class="topbar-right">
            <span class="pill" id="connPill"><span class="dot" id="connDot"></span><span id="connText">已连接</span></span>
            <button class="btn btn--ghost btn--sm" id="copyAddr" type="button">复制地址</button>
        </div>
    </header>

    <main class="container">
     <div class="container-inner">
        <nav class="tabs" role="tablist" aria-label="主功能">
            <button class="tab is-active" id="tabUpload" type="button" role="tab" aria-selected="true" aria-controls="uploadPanel">上传</button>
            <button class="tab" id="tabDownload" type="button" role="tab" aria-selected="false" aria-controls="downloadPanel">下载</button>
        </nav>

        <!-- ---------- 上传 ---------- -->
        <section class="panel" id="uploadPanel" role="tabpanel" aria-labelledby="tabUpload">
            <div class="panel-head">
                <h2 class="panel-title">上传文件</h2>
                <span class="chip" id="uploadChip">未选择文件</span>
            </div>

            <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择文件或拖拽到此处">
                <svg class="dz-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M3 15v3a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-3"/>
                </svg>
                <div class="dz-text">
                    <p class="dz-title">把文件拖到这里</p>
                    <p class="dz-sub muted">或用下面的按钮选择</p>
                </div>
                <div class="dz-actions">
                    <button class="btn btn--soft" id="pickFiles" type="button">选择文件</button>
                    <button class="btn btn--soft" id="pickFolder" type="button">选择文件夹</button>
                </div>
            </div>

            <input type="file" id="fileInput" multiple hidden>
            <input type="file" id="folderInput" webkitdirectory multiple hidden>

            <div class="listbar" id="uploadListBar" hidden>
                <span class="listbar-info" id="uploadSummary">—</span>
                <button class="btn btn--link btn--sm" id="toggleFiles" type="button" aria-expanded="false">展开</button>
            </div>
            <ul class="filelist" id="fileList"></ul>

            <div class="progress" id="progress" hidden>
                <div class="progress-top">
                    <span id="progLabel">准备中…</span>
                    <button class="btn btn--link btn--sm" id="cancelUpload" type="button">取消</button>
                </div>
                <div class="track"><div class="bar" id="progBar"></div></div>
                <div class="progress-sub" id="progSub"></div>
            </div>

            <div class="notice" id="uploadNotice" role="status" aria-live="polite" hidden></div>

            <div class="panel-foot">
                <span class="foot-info muted" id="uploadFoot">局域网内直连，不经过服务器</span>
                <button class="btn btn--primary" id="uploadBtn" type="button" disabled>开始上传</button>
            </div>
        </section>

        <!-- ---------- 下载 ---------- -->
        <section class="panel" id="downloadPanel" role="tabpanel" aria-labelledby="tabDownload" hidden>
            <div class="panel-head">
                <h2 class="panel-title">下载文件</h2>
                <div class="head-actions">
                    <button class="btn btn--link btn--sm" id="toggleDl" type="button" aria-expanded="false">展开全部</button>
                    <button class="btn btn--link btn--sm" id="refreshBtn" type="button">刷新</button>
                </div>
            </div>

            <div class="empty" id="dlEmpty">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5"/>
                </svg>
                <p class="empty-title">这里还没有文件</p>
                <p class="empty-sub muted">从另一台设备上传后，文件会出现在这里</p>
            </div>

            <ul class="filelist" id="dlList"></ul>

            <div class="panel-foot">
                <span class="foot-info muted">「打包」＝把整个文件夹压成 zip 下载</span>
                <a class="btn btn--soft" id="zipAll" href="#" hidden>全部打包下载</a>
            </div>
        </section>
     </div>
    </main>

    <!-- ---------- 快捷文本（吸底） ---------- -->
    <footer class="composer">
        <div class="composer-inner">
            <div class="composer-head">
                <span class="composer-title">快捷文本</span>
                <span class="composer-status muted" id="noteStatus" role="status" aria-live="polite"></span>
                <span class="composer-count muted" id="noteMeta">0 字</span>
            </div>
            <div class="composer-row">
                <textarea id="noteText" class="note-input" rows="1" placeholder="输入或粘贴文字…"></textarea>
                <div class="composer-actions">
                    <button class="btn btn--soft btn--sm" id="noteCopy" type="button">复制</button>
                    <button class="btn btn--primary btn--sm" id="noteSend" type="button">发送</button>
                </div>
            </div>
        </div>
    </footer>
</div>

<script src="/app.js" defer></script>
</body>
</html>
