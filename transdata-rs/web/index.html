    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 10px; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        .card h2 { color: #555; margin-bottom: 8px; font-size: 13px; }
        .url-line { background: #f8f9fa; padding: 7px 10px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #4a5a7a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-pick { border: 2px dashed #667eea; border-radius: 8px; padding: 9px 12px; text-align: center; cursor: pointer; transition: all 0.3s; font-size: 13px; font-weight: 600; color: #667eea; background: #f8f9ff; }
        .file-pick:hover { border-color: #4d5ed8; background: #eef0ff; }
        .pick-hint { font-size: 11px; color: #999; text-align: center; margin: 5px 0 2px; }
        #fileInput, #folderInput { display: none; }
        .file-list { margin-top: 8px; background: #fff; }
        .dl-list { margin-top: 8px; }
        .dl-nav { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        .page-btn { flex: 1; padding: 6px; border: 1px solid #c5cad8; background: white; color: #5a6a8a; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .page-btn:disabled { opacity: 0.4; cursor: default; }
        .page-info { font-size: 12px; color: #999; white-space: nowrap; }
        .count-row { font-size: 12px; color: #667eea; text-align: center; padding: 2px 0 8px; background: #fff; }
        .list-more { font-size: 11px; color: #999; text-align: center; padding: 6px; }
        .file-item { display: flex; align-items: center; padding: 2px 10px; background: #fff; border: 1px solid #e8ebf5; border-radius: 6px; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { font-weight: 500; color: #333; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-size { font-size: 11px; color: #999; }
        .empty-hint { text-align: center; color: #999; padding: 14px; font-size: 13px; }
        .btn { width: 100%; padding: 9px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-top: 10px; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { padding: 6px; margin-top: 8px; border-radius: 8px; text-align: center; font-size: 12px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .tab-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 7px; border: 2px solid #e9ecef; background: white; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { border-color: #667eea; background: #667eea; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .note-box { width: 100%; min-height: 64px; border: 2px solid #e9ecef; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; resize: vertical; line-height: 1.4; margin-top: 8px; }
        .note-box:focus { border-color: #667eea; outline: none; }
        .note-btns { display: flex; gap: 8px; }
        .note-btns .btn { width: auto; flex: 1; margin-top: 0; padding: 7px; font-size: 13px; }
        .download-btn { padding: 3px 10px; background: white; color: #667eea; border: 1px solid #667eea; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 12px; white-space: nowrap; font-weight: 600; }
        .delete-btn { padding: 3px 10px; background: white; color: #dc3545; border: 1px solid #f1b2b7; border-radius: 6px; cursor: pointer; font-size: 12px; margin-left: 6px; white-space: nowrap; }
        .rm-btn { flex-shrink: 0; margin-left: 8px; width: 24px; height: 24px; border: none; border-radius: 50%; background: #e9ecef; color: #555; font-size: 14px; line-height: 1; cursor: pointer; }
        .rm-btn:hover { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="url-line" id="serverUrl">地址：加载中…</div>
        </div>

        <div class="card">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('upload')">上传</button>
                <button class="tab-btn" onclick="switchTab('download')">下载</button>
            </div>

            <div id="uploadTab" class="tab-content active">
                <div class="file-pick" onclick="document.getElementById('fileInput').click()">
                    上传文件
                </div>
                <p class="pick-hint">提示：安卓手机点击「上传文件」后，长按文件可触发多选</p>
                <input type="file" id="fileInput" multiple onchange="handleFileSelect(event)">
                <div class="file-pick" style="margin-top:6px" onclick="document.getElementById('folderInput').click()">
                    上传文件夹(仅支持电脑浏览器)
                </div>
                <input type="file" id="folderInput" webkitdirectory multiple onchange="handleFolderSelect(event)">
                <div class="file-list" id="fileList"></div>
                <button class="btn" id="uploadBtn" onclick="uploadFiles()" disabled>确认</button>
                <div id="statusMsg"></div>
            </div>

            <div id="downloadTab" class="tab-content">
                <div class="count-row" id="dlCount"></div>
                <div class="dl-list" id="downloadList">
                    <p class="empty-hint">暂无文件</p>
                </div>
                <div class="dl-nav" id="dlNav" style="display:none"></div>
            </div>
        </div>

        <div class="card">
            <h2>便签（自动同步 · 不限长度）</h2>
            <div class="note-btns">
                <button class="btn" id="noteCopyBtn" onclick="noteCopy()">复制</button>
                <button class="btn" id="noteSendBtn" onclick="noteSend()">发送</button>
            </div>
            <textarea id="noteText" class="note-box" placeholder="输入或粘贴文字，点「发送」同步到另一端"></textarea>
            <div id="noteStatus"></div>
        </div>
    </div>

    <script>
        let selectedFiles = []; // [{file: File, path: 'a/b.txt'}]
        const BATCH_MAX_FILES = 32;
        const BATCH_MAX_BYTES = 256 * 1024 * 1024;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            if (tab === 'upload') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('uploadTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('downloadTab').classList.add('active');
                loadDownloadList();
            }
        }

        function handleFileSelect(event) {
            // 累加模式：部分手机浏览器一次只能挑一个文件，
            // 反复点选会逐个追加（同路径+同大小自动去重）。
            const picked = Array.from(event.target.files).map(f => ({ file: f, path: f.name }));
            mergeSelected(picked);
            event.target.value = ''; // 清空 input 才能再次选同名文件
            afterFilesPicked();
        }

        function mergeSelected(picked) {
            const have = new Set(selectedFiles.map(it => it.path + '|' + it.file.size));
            for (const it of picked) {
                if (!have.has(it.path + '|' + it.file.size)) selectedFiles.push(it);
            }
        }

        function handleFolderSelect(event) {
            const files = Array.from(event.target.files);
            const picked = files.map(f => ({
                file: f,
                path: f.webkitRelativePath ? f.webkitRelativePath.replace(/\\/g, '/') : f.name
            }));
            event.target.value = '';
            // 手机等不支持 webkitdirectory 的浏览器会退化成普通多选：
            // 用相对路径是否为空来识别，给用户明确提示而不是假装支持。
            if (picked.length > 0 && picked.every(it => it.path.indexOf('/') === -1)) {
                document.getElementById('statusMsg').innerHTML =
                    '<div class="status error">当前浏览器不支持选文件夹（手机浏览器均如此）。'
                    + '已把选中的 ' + picked.length + ' 个文件按普通文件方式累加，可直接上传；'
                    + '文件很多时建议先在手机里选中文件夹压缩成 zip 再传。</div>';
            }
            mergeSelected(picked);
            afterFilesPicked();
        }

        function afterFilesPicked() {
            document.getElementById('fileList').scrollIntoView();
            if (selectedFiles.length > 50000) {
                document.getElementById('statusMsg').innerHTML =
                    '<div class="status error">文件数 ' + selectedFiles.length + ' 超过 5 万，浏览器可能卡顿，建议先打包再传</div>';
            } else {
                document.getElementById('statusMsg').innerHTML = '';
            }
            renderFileList();
            document.getElementById('uploadBtn').disabled = selectedFiles.length === 0;
        }

        function renderFileList() {
            const list = document.getElementById('fileList');
            const preview = selectedFiles.slice(0, 200);
            let html = preview.map((it, i) => `<div class="file-item"><div class="file-info"><div class="file-name">${escHtml(it.path)}</div><div class="file-size">${formatSize(it.file.size)}</div></div><button class="rm-btn" onclick="removeFile(${i})">×</button></div>`).join('');
            if (selectedFiles.length > 200) {
                html += `<div class="file-item"><div class="file-info"><div class="file-size">… 共 ${selectedFiles.length} 个文件，仅显示前 200 个</div></div></div>`;
            }
            list.innerHTML = html;
        }

        function removeFile(idx) {
            selectedFiles.splice(idx, 1);
            renderFileList();
            document.getElementById('uploadBtn').disabled = selectedFiles.length === 0;
        }

        function escHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ------------------------------------------------------------------
        // 分批上传 + 清单校验：
        //  - 每批 ≤32 个文件且 ≤256MB，单批失败自动重试 3 次（已完好的自动跳过）
        //  - 全部传完后 POST /verify 逐条核对 path+size（截断/丢文件一目了然）
        // ------------------------------------------------------------------
        function buildBatches(items) {
            const batches = [];
            let cur = [], curBytes = 0;
            for (const it of items) {
                if (cur.length > 0 && (cur.length >= BATCH_MAX_FILES || curBytes + it.file.size > BATCH_MAX_BYTES)) {
                    batches.push(cur); cur = []; curBytes = 0;
                }
                cur.push(it); curBytes += it.file.size;
            }
            if (cur.length) batches.push(cur);
            return batches;
        }

        function manifestOf(items) {
            return items.map(it => ({ path: it.path, size: it.file.size }));
        }

        async function verifyManifest(entries) {
            const chunks = [];
            for (let i = 0; i < entries.length; i += 15000) chunks.push(entries.slice(i, i + 15000));
            let all_ok = true; const results = [];
            for (const c of chunks) {
                const resp = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: c })
                });
                const j = await resp.json();
                if (!j.all_ok) all_ok = false;
                results.push(...(j.results || []));
            }
            return { all_ok, results };
        }

        async function uploadFiles() {
            const btn = document.getElementById('uploadBtn');
            const statusMsg = document.getElementById('statusMsg');
            if (selectedFiles.length === 0) { return; }
            btn.disabled = true;
            statusMsg.innerHTML = '';

            // 0) 先确认服务器可达，否则立即明确报错（避免关着服务端时干等重试）
            try {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 3000);
                const r = await fetch('/info', { signal: ctrl.signal });
                clearTimeout(t);
                if (!r.ok) throw 0;
            } catch (e) {
                statusMsg.innerHTML = '<div class="status error">无法连接中转服务器：请确认电脑上运行着 transdata.exe，且手机与电脑在同一网络</div>';
                btn.disabled = false;
                btn.textContent = '确认';
                return;
            }

            // 1) 先核对一次，已完好的不重传（断点续传效果）
            let skip = new Set();
            try {
                const j = await verifyManifest(manifestOf(selectedFiles));
                (j.results || []).forEach(r => { if (r.status === 'ok') skip.add(r.path); });
            } catch (e) {}
            const todo = selectedFiles.filter(it => !skip.has(it.path));
            if (skip.size > 0) {
                statusMsg.innerHTML = '<div class="status success">检测到 ' + skip.size + ' 个文件已完好，跳过；剩余 ' + todo.length + ' 个待传</div>';
            }

            // 2) 分批上传，单批失败重试 3 次
            const batches = buildBatches(todo);
            let failedCount = 0;
            for (let bi = 0; bi < batches.length; bi++) {
                const batch = batches[bi];
                let ok = false;
                for (let attempt = 1; attempt <= 3 && !ok; attempt++) {
                    btn.textContent = '传输中 批次 ' + (bi + 1) + '/' + batches.length + ' …';
                    statusMsg.innerHTML = '<div class="status">第 ' + attempt + ' 次传输中…</div>';
                    const fd = new FormData();
                    for (const it of batch) fd.append('file', it.file, it.path);
                    try {
                        const resp = await fetch('/upload', { method: 'POST', body: fd });
                        const j = await resp.json();
                        ok = !!(j && j.success);
                    } catch (e) { ok = false; }
                    if (!ok && attempt < 3) {
                        statusMsg.innerHTML = '<div class="status error">第 ' + attempt + ' 次失败，2 秒后重试…</div>';
                        await new Promise(r => setTimeout(r, 2000));
                    }
                }
                if (ok) {
                    statusMsg.innerHTML = '<div class="status success">批次 ' + (bi + 1) + '/' + batches.length + ' 完成（' + batch.length + ' 个文件）</div>';
                } else {
                    failedCount = selectedFiles.length;
                    statusMsg.innerHTML = '<div class="status error">批次 ' + (bi + 1) + ' 重试 3 次仍失败，已停止（重开本页再点上传可自动续传）</div>';
                    break;
                }
            }

            // 3) 最终清单校验
            if (failedCount === 0 && todo.length > 0) {
                btn.textContent = '校验中…';
                let j;
                try {
                    j = await verifyManifest(manifestOf(todo));
                } catch (e) { j = { all_ok: false, results: [] }; }
                const bad = (j.results || []).filter(r => r.status !== 'ok');
                if (j.all_ok) {
                    statusMsg.innerHTML = '<div class="status success">✅ 共 ' + selectedFiles.length + ' 个文件，校验全部通过</div>';
                } else {
                    const sample = bad.slice(0, 20).map(r => escHtml(r.path) + '（' + r.status + '）').join('<br>');
                    statusMsg.innerHTML = '<div class="status error">⚠️ ' + bad.length + ' 个文件未通过校验：<br>' + sample +
                        (bad.length > 20 ? '<br>…（共 ' + bad.length + ' 个）' : '') + '<br>重开本页再点上传可自动续传</div>';
                }
            } else if (failedCount > 0) {
                statusMsg.innerHTML += '<div class="status error">本批次传输失败，未做最终校验</div>';
            }

            if (failedCount === 0) {
                selectedFiles = [];
                document.getElementById('fileInput').value = '';
                document.getElementById('folderInput').value = '';
                document.getElementById('fileList').innerHTML = '';
                btn.textContent = '✅ 完成';
                btn.disabled = true;
            } else {
                // 保留待传列表：直接再点「确认」即可自动续传（已完好的会跳过）
                btn.textContent = '确认';
                btn.disabled = false;
            }
        }

        function encPath(p) { return p.split('/').map(encodeURIComponent).join('/'); }

        // 下载列表：最原始的分页——每页 8 行（行已收窄），上一页/下一页按钮，
        // 无嵌套滚动框（避开安卓魔改浏览器的渲染坑）。数据一次拉回，翻页纯本地切。
        const DL_PAGE = 8;
        let dlFiles = null;   // 最近一次 /files 的完整结果
        let dlPage = 1;

        async function loadDownloadList() {
            const list = document.getElementById('downloadList');
            const countEl = document.getElementById('dlCount');
            try {
                const response = await fetch('/files');
                dlFiles = await response.json();
            } catch (error) {
                countEl.textContent = '';
                list.innerHTML = '<p class="empty-hint" style="color:#dc3545;">加载失败</p>';
                document.getElementById('dlNav').style.display = 'none';
                return;
            }
            dlPage = 1;
            renderDlPage();
        }

        function dlPrev() { if (dlPage > 1) { dlPage--; renderDlPage(); } }
        function dlNext() { dlPage++; renderDlPage(); }

        function renderDlPage() {
            const list = document.getElementById('downloadList');
            const countEl = document.getElementById('dlCount');
            const nav = document.getElementById('dlNav');
            const all = dlFiles ? (dlFiles.files || []) : [];
            if (all.length === 0) {
                countEl.textContent = '';
                list.innerHTML = '<p class="empty-hint">暂无文件</p>';
                nav.style.display = 'none';
                return;
            }
            // 顶层文件 vs 文件夹（上传目录的相对路径按首段分组）
            const topFiles = all.filter(f => !f.name.includes('/'));
            const folders = {};
            for (const f of all.filter(f => f.name.includes('/'))) {
                const top = f.name.split('/')[0];
                if (!folders[top]) folders[top] = { count: 0, bytes: 0 };
                folders[top].count++; folders[top].bytes += f.size;
            }
            const folderNames = Object.keys(folders);

            const totalTop = topFiles.length;
            const totalPages = Math.max(1, Math.ceil(totalTop / DL_PAGE));
            if (dlPage > totalPages) dlPage = totalPages;

            countEl.innerHTML = '共 ' + all.length + ' 个文件' +
                (dlFiles.truncated ? '（超过 1 万仅显示部分）' : '') +
                (totalPages === 1 && folderNames.length === 1 && totalTop === 0
                    ? `&nbsp;｜&nbsp;<a href="/zip/${encPath(folderNames[0])}" style="color:#667eea;">全部打包下载 zip</a>`
                    : '');

            let html = '';
            for (const [name, meta] of Object.entries(folders)) {
                html += `<div class="file-item"><div class="file-info"><div class="file-name">&#128193; ${escHtml(name)}</div><div class="file-size">${meta.count} 个文件 · ${formatSize(meta.bytes)}</div></div>` +
                    `<a href="/zip/${encPath(name)}" class="download-btn">打包下载</a>` +
                    `<button class="delete-btn" data-p="${escHtml(name)}" onclick="deleteItem(this.dataset.p)">删除</button></div>`;
            }
            const start = (dlPage - 1) * DL_PAGE;
            const slice = topFiles.slice(start, start + DL_PAGE);
            for (const f of slice) {
                html += `<div class="file-item"><div class="file-info"><div class="file-name">${escHtml(f.name)}</div><div class="file-size">${formatSize(f.size)}</div></div>` +
                    `<a href="/download/${encPath(f.name)}" class="download-btn">下载</a>` +
                    `<button class="delete-btn" data-p="${escHtml(f.name)}" onclick="deleteItem(this.dataset.p)">删除</button></div>`;
            }
            if (slice.length === 0 && totalTop > 0) {
                html += '<p class="empty-hint">本页无散文件（见上方文件夹）</p>' + html;
            }
            list.innerHTML = html;

            // 上一页 / 下一页（只有多页时才显示）
            if (totalPages > 1) {
                nav.style.display = 'flex';
                nav.innerHTML = `<button class="page-btn" onclick="dlPrev()" ${dlPage === 1 ? 'disabled' : ''}>上一页</button>` +
                    `<span class="page-info">${dlPage}/${totalPages} 页</span>` +
                    `<button class="page-btn" onclick="dlNext()" ${dlPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            } else {
                nav.style.display = 'none';
                nav.innerHTML = '';
            }
        }
        async function deleteItem(p) {
            if (!confirm('删除「' + p + '」？')) return;
            try {
                const response = await fetch('/delete/' + encPath(p), { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    loadDownloadList();
                }
                else alert('删除失败：' + (result.error || '未知错误'));
            } catch (error) {
                alert('删除失败');
            }
        }

        // ------------------------------------------------------------------
        // 快捷文本（shared note）：/note 存取 + /ws 实时推送，不轮询。
        // 两端各一个输入框，点「发送」后另一端自动填入（直接覆盖）。
        // 点「复制」= 取最新 + 全选 + （HTTPS 下）一键进本机剪贴板。
        // ------------------------------------------------------------------
        let noteLastV = 0;   // 最近应用到的版本号
        let noteWs = null;

        const noteText = document.getElementById('noteText');
        const noteStatus = document.getElementById('noteStatus');

        function noteSetStatus(msg, ok) {
            noteStatus.innerHTML = msg
                ? '<div class="status ' + (ok ? 'success' : 'error') + '">' + msg + '</div>'
                : '';
        }

        async function noteInit() {
            try {
                const r = await fetch('/note');
                const j = await r.json();
                if (j.success) {
                    noteText.value = j.text || '';
                    noteLastV = j.v || 0;
                }
            } catch (e) {}
            noteConnectWs();
        }

        async function noteSend() {
            const text = noteText.value;
            try {
                const r = await fetch('/note', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                    body: text
                });
                const j = await r.json();
                if (j.success) {
                    noteLastV = j.v;
                    noteSetStatus('已发送，另一端将自动填入', true);
                } else {
                    noteSetStatus('发送失败', false);
                }
            } catch (e) {
                noteSetStatus('发送失败（网络错误）', false);
            }
        }

        async function noteCopy() {
            // 1) 取最新并显示（不清空自己正在编辑的内容：取的是服务端最新）
            try {
                const r = await fetch('/note');
                const j = await r.json();
                if (j.success) {
                    noteText.value = j.text || '';
                    noteLastV = j.v || 0;
                }
            } catch (e) {} // 取不到就保持现有内容
            // 2) 默认全选
            noteText.focus();
            noteText.select();
            // 3) 能一键就一键（HTTPS/localhost），否则靠全选+长按复制
            let copied = false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(noteText.value);
                    copied = true;
                } else {
                    copied = document.execCommand && document.execCommand('copy');
                }
            } catch (e) { copied = false; }
            if (copied) noteSetStatus('已复制到剪贴板', true);
            else noteSetStatus('已全选：长按文字 → 复制，即可粘贴使用', true);
        }

        function noteConnectWs() {
            if (noteWs && (noteWs.readyState === 0 || noteWs.readyState === 1)) return;
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            noteWs = new WebSocket(proto + '//' + location.host + '/ws');
            noteWs.onmessage = (e) => {
                let m;
                try { m = JSON.parse(e.data); } catch (_) { return; }
                if (!m || typeof m.v !== 'number' || m.v <= noteLastV) return;
                // 直接覆盖本地内容（包括未发送的编辑）
                noteLastV = m.v;
                noteText.value = m.text || '';
                noteSetStatus('已收到对方内容', true);
            };
            noteWs.onclose = () => { noteWs = null; setTimeout(noteConnectWs, 2000); };
            noteWs.onerror = () => { try { noteWs.close(); } catch (_) {} };
        }

        async function getServerUrl() {
            try {
                const response = await fetch('/info');
                const info = await response.json();
                const el = document.getElementById('serverUrl');
                const text = '地址：' + info.url;
                el.textContent = text;
                el.title = text; // 整行可点开看全文（长路径会被省略号截断）
            } catch (error) {
                document.getElementById('serverUrl').textContent = '地址：' + window.location.href;
            }
        }

        getServerUrl();
        noteInit();
    </script>
</body>
</html>
