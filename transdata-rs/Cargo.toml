[package]
name = "transdata"
version = "1.3.0"
edition = "2021"
description = "PC <-> Android file transfer server + native GUI, single exe"

[dependencies]
# 在线更新（查版本 / 下载新 exe）
ureq = "2"
tokio = { version = "1", features = ["full"] }
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.28", features = ["wgpu"] }
rfd = "0.15"
thiserror = "2"
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde_json = "1"
# zip 4.x: `ZipWriter::new_stream` 可以直接往不可 seek 的流上写（用数据描述符），
# 这样打包能边压边传，不用先在磁盘上落一份完整的临时压缩包。
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
memchr = "2"
flate2 = "1"
rand = "0.8"
# HTTPS（可选功能，自签证书）
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"

[build-dependencies]
embed-resource = "2"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
